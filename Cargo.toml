[package]
name = "crabboy"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", features = ["std", "backtrace"] }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.4.7"
derivative = "2.2.0"
tracing = { version = "0.1.41", features = ["log"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
wgpu = { version = "30.0.1", features = ["glsl"] }

[profile.release]
debug = 1
opt-level = 3
lto = "full"

[profile.dev]
debug = 1
opt-level = 1
lto = "off"
