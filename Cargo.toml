[package]
name = "crabboy"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.97" }
clap = { version = "4.5.31", features = ["derive"] }
ctrlc = "3.4.7"
derivative = "2.2.0"
glium = "0.36.0"
tracing = { version = "0.1.41", features = ["log"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.release]
debug = 1
opt-level = 3
lto = "fat"
